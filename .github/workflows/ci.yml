name: CI

# The repo had no CI. This gates every push/PR on the engine goldens + a clean
# build. Deterministic, no network needed (engines run on fixtures).
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install
        run: npm ci
      - name: Engine golden tests (GV1-GV12)
        run: npm test
      - name: Build the static site
        run: npm run build

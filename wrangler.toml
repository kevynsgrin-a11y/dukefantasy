# Cloudflare Pages configuration for DukeFantasy.
#
# Deploy (after `npm run build`):
#   npx wrangler pages deploy public --project-name dukefantasy
# Local dev with Functions + KV emulation:
#   npx wrangler pages dev public
#
# The site is static; Pages Functions under /functions provide two edge
# capabilities only:
#   - /api/feed/*     edge-cached proxy for upstream open-data feeds
#                     (Sleeper / FFC / nflverse / Open-Meteo) so the browser
#                     never hits third-party APIs directly and their politeness
#                     rules are honored server-side.
#   - /api/subscribe  KV-backed email capture (double opt-in ready).

name = "dukefantasy"
pages_build_output_dir = "public"
compatibility_date = "2026-07-01"

# --- KV namespaces -----------------------------------------------------------
# Create with:
#   npx wrangler kv namespace create DUKE_CACHE
#   npx wrangler kv namespace create DUKE_SUBSCRIBERS
# then paste the returned ids below (and *_preview_id for `pages dev`).
[[kv_namespaces]]
binding = "DUKE_CACHE"
id = "894fee0cebbb47f7af37875693cc02bd"          # edge feed cache + daily Sleeper player-DB snapshot
preview_id = "894fee0cebbb47f7af37875693cc02bd"

[[kv_namespaces]]
binding = "DUKE_SUBSCRIBERS"
id = "17d4ff8770584008befcbd0d4032b29e"          # email capture list
preview_id = "17d4ff8770584008befcbd0d4032b29e"

[vars]
SITE_NAME = "DukeFantasy"
SITE_ORIGIN = "https://dukefantasy.com"
# Descriptive User-Agent sent on every upstream fetch (politeness requirement).
FEED_USER_AGENT = "DukeFantasy/0.1 (+https://dukefantasy.com; fantasy draft tools; contact hello@dukefantasy.com)"
